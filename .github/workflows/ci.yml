name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools (rokit.toml)
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Format
        run: stylua --check src tests scripts

      - name: Lint
        run: selene src tests scripts

      - name: Type check (strict Luau)
        run: scripts/typecheck.sh

      - name: Tests
        run: lune run scripts/test.luau

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/blinkweave.rbxlx

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: blinkweave-place
          path: build/blinkweave.rbxlx
